<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración · Autodefensa</title>
  <style>
    :root {
      color-scheme: dark;
      --pink: #ff9dcc;
      --green: #c9f5bb;
      --black: #111;
      --panel: #1b1b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: var(--black); color: #f7f2f5;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(100%, 440px); padding: 32px;
      background: var(--panel); border: 1px solid #484048;
      border-radius: 18px;
    }
    .flower { color: var(--pink); font-size: 28px; }
    h1 { margin: 8px 0; font-size: 28px; }
    p { color: #c8c1c7; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%; padding: 13px; border-radius: 8px;
      border: 1px solid #61545e; background: #101010;
      color: white; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 18px; padding: 13px;
      border: 0; border-radius: 8px; cursor: pointer;
      background: var(--pink); color: #171017;
      font-size: 16px; font-weight: bold;
    }
    button.secondary { background: var(--green); }
    button:disabled { opacity: .55; cursor: wait; }
    #status {
      margin-top: 18px; padding: 12px; border-radius: 8px;
      background: #292329; overflow-wrap: anywhere;
    }
    .hidden { display: none; }
    .small { font-size: 13px; }
    a { color: var(--pink); }
  </style>
</head>
<body>
<main>
  <div class="flower">✿ AUTODEFENSA</div>
  <h1>Panel de administración</h1>
  <p>Acceso privado para gestionar el contenido de la banda.</p>

  <section id="login">
    <form id="login-form">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username"
             required placeholder="Tu correo de Supabase">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password"
             required placeholder="Tu contraseña">
      <button id="login-button" type="submit">Iniciar sesión</button>
    </form>
    <button id="forgot-password" class="secondary" type="button">Olvidé mi contraseña</button>
  </section>

  <section id="recovery" class="hidden">
    <form id="recovery-form">
      <label for="new-password">Nueva contraseña</label>
      <input id="new-password" type="password" autocomplete="new-password"
             minlength="8" required placeholder="Mínimo 8 caracteres">
      <label for="confirm-password">Repite la nueva contraseña</label>
      <input id="confirm-password" type="password" autocomplete="new-password"
             minlength="8" required placeholder="Repite la contraseña">
      <button id="recovery-button" type="submit">Guardar contraseña nueva</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <p>Sesión iniciada como <strong id="account"></strong></p>
    <p id="permission"></p>
    <p class="small">Esta primera versión comprueba el acceso. La edición de contenido se añadirá después de verificar los permisos.</p>
    <button id="logout" class="secondary" type="button">Cerrar sesión</button>
  </section>

  <div id="status" role="status" aria-live="polite">Preparando acceso…</div>
  <p class="small"><a href="/">Volver a la web pública</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const url = {{ supabase_url|tojson }};
  const key = {{ supabase_key|tojson }};
  const expectedUser = "6318bc1e-894a-4045-86f5-6c4ff3f24386";
  const $ = id => document.getElementById(id);
  const status = message => { $("status").textContent = message; };

  if (!url || !key) {
    status("Falta configurar SUPABASE_URL o SUPABASE_PUBLISHABLE_KEY en el entorno de este despliegue.");
    $("login-button").disabled = true;
    return;
  }
  if (!window.supabase) {
    status("No se pudo cargar el servicio de autenticación. Comprueba tu conexión e inténtalo de nuevo.");
    return;
  }

  const client = window.supabase.createClient(url, key);

  function showSession(user) {
    if (!user) {
      $("login").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
      return;
    }

    $("login").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    $("account").textContent = user.email || "Cuenta autenticada";

    if (user.id === expectedUser) {
      $("permission").textContent =
        "Tu cuenta coincide con el usuario autorizado por las políticas actuales.";
      status("Sesión iniciada correctamente.");
    } else {
      $("permission").textContent =
        "La sesión funciona, pero esta cuenta no coincide con el usuario autorizado para modificar contenido. No intentes editar todavía.";
      status("Acceso iniciado; falta verificar los permisos de edición.");
    }
  }

  function showRecovery() {
    $("login").classList.add("hidden");
    $("dashboard").classList.add("hidden");
    $("recovery").classList.remove("hidden");
    status("Crea tu nueva contraseña.");
  }

  $("forgot-password").addEventListener("click", async () => {
    const email = $("email").value.trim();
    if (!email) {
      status("Escribe tu correo en el campo de correo electrónico primero.");
      $("email").focus();
      return;
    }

    status("Enviando correo de recuperación…");
    try {
      const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/admin"
      });
      if (error) throw error;
      status("Si el correo está registrado, recibirás un enlace para crear una contraseña nueva. Revisa también el spam.");
    } catch (error) {
      status(error.message || "No se pudo enviar el correo de recuperación.");
    }
  });

  $("recovery-form").addEventListener("submit", async event => {
    event.preventDefault();
    const password = $("new-password").value;
    const confirmation = $("confirm-password").value;

    if (password !== confirmation) {
      status("Las contraseñas no coinciden.");
      return;
    }

    const button = $("recovery-button");
    button.disabled = true;
    status("Guardando la contraseña nueva…");

    try {
      const { error } = await client.auth.updateUser({ password });
      if (error) throw error;
      $("recovery-form").reset();
      $("recovery").classList.add("hidden");
      $("login").classList.remove("hidden");
      status("Contraseña actualizada. Ya puedes iniciar sesión.");
    } catch (error) {
      status(error.message || "No se pudo actualizar la contraseña. Solicita un enlace nuevo.");
    } finally {
      button.disabled = false;
    }
  });

  client.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") showRecovery();
  });

  if (window.location.hash.includes("type=recovery")) {
    showRecovery();
  }

  $("login-form").addEventListener("submit", async event => {
    event.preventDefault();
    const button = $("login-button");
    button.disabled = true;
    status("Comprobando tus datos…");

    try {
      const { data, error } = await client.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });
      if (error) throw error;
      showSession(data.user);
    } catch (error) {
      status(error.message || "No se pudo iniciar sesión.");
    } finally {
      button.disabled = false;
    }
  });

  $("logout").addEventListener("click", async () => {
    const { error } = await client.auth.signOut();
    if (error) {
      status("No se pudo cerrar sesión: " + error.message);
      return;
    }
    $("password").value = "";
    showSession(null);
    status("Sesión cerrada.");
  });

  client.auth.getSession().then(({ data, error }) => {
    if (error) status("No se pudo comprobar la sesión: " + error.message);
    else {
      showSession(data.session?.user || null);
      if (!data.session) status("Introduce tu correo y contraseña de Supabase.");
    }
  });
})();
</script>
</body>
</html>
